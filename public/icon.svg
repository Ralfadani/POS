<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A5C" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Icon Background (Squircle / Rounded Box) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Steam Particles -->
  <path d="M196 150 C 180 120, 210 90, 196 60" fill="none" stroke="url(#steamGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M256 140 C 240 110, 270 80, 256 50" fill="none" stroke="url(#steamGrad)" stroke-width="14" stroke-linecap="round" />
  <path d="M316 150 C 300 120, 330 90, 316 60" fill="none" stroke="url(#steamGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Coffee Cup Body with Handle -->
  <g filter="url(#glow)">
    <!-- Cup -->
    <path d="M128 180 L384 180 C384 310, 340 370, 256 370 C172 370, 128 310, 128 180 Z" fill="url(#cupGrad)" />
    
    <!-- Cup Handle -->
    <path d="M384 210 C440 210, 440 300, 370 300" fill="none" stroke="url(#cupGrad)" stroke-width="26" stroke-linecap="round" />
    
    <!-- Plate / Saucer -->
    <ellipse cx="256" cy="400" rx="170" ry="24" fill="#ffffff" opacity="0.9" />
    <ellipse cx="256" cy="396" rx="140" ry="16" fill="#10b981" />
  </g>
  
  <!-- POS Tablet / Circuit Accent on Cup -->
  <rect x="216" y="230" width="80" height="60" rx="10" fill="#ffffff" opacity="0.95" />
  <rect x="226" y="242" width="60" height="8" rx="4" fill="#1A3A5C" />
  <rect x="226" y="258" width="40" height="6" rx="3" fill="#10b981" />
  <circle cx="276" cy="261" r="3" fill="#f59e0b" />
</svg>
